{% extends 'base.html' %} {% block content %}
<h2>My Notices</h2>

{% for notice in notices %}
<div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px">
  <h3>{{ notice.title }}</h3>
  <p>{{ notice.message }}</p>
  <small>{{ notice.created_at }}</small>
</div>
{% empty %}
<p>No notices for you.</p>
{% endfor %} {% endblock %}
