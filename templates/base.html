<!doctype html>
<html>
  <head>
    <title>Student Notice Board</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f4f4f4;
      }
      nav a {
        margin-right: 15px;
        text-decoration: none;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
      }
      .message {
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 6px;
        background: #eee;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 12px;
      }
      button {
        padding: 10px 18px;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      table,
      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
      }
      ul {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'student_add' %}">Add Student</a>
      <a href="{% url 'student_list' %}">Students</a>
      <a href="{% url 'notice_add' %}">Add Notice</a>
      <a href="{% url 'notice_list' %}">Notices</a>
      <a href="{% url 'import_students' %}">Import Students</a>
      <a href="{% url 'export_students' %}">Export Students</a>

      {% if user.is_authenticated %}
      <a href="{% url 'logout' %}">Logout</a>
      {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'signup' %}">Signup</a>
      {% endif %}
    </nav>

    <hr />

    <div class="container">
      {% if messages %} {% for message in messages %}
      <div class="message">{{ message }}</div>
      {% endfor %} {% endif %} {% block content %}{% endblock %}
    </div>
  </body>
</html>
